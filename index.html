<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Invisibility</title>
</head>

<body>
    <section id="face">
        <div id="eyes">
            <p class="eye" id="eye-left"></p>
            <p class="eye" id="eye-right"></p>
        </div>
    </section>

    <section id="upper-body">
        <div class="arm body-member" id="arm-left"></div>
        <div id="torso"></div>
        <div class="arm body-member" id="arm-right"></div>
    </section>

    <section id="lower-body">
        <div class="body-member leg" id="leg-left"></div>
        <div class="body-member leg" id="leg-right"></div>
    </section>
    <script type="module" src="script.js"></script>
</body>

</html>
